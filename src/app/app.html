<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Tokyo+Zoo&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
</style>
<div>
  <div class="head">
    <h2 class="title">Nutrition Calculator</h2>
  </div>
  <div class="calc-container">
    <div style="margin: 5px; font-family:'Roboto Condensed'; font-size: 14px;">Nutrition Information (from food
      packaging)</div>
    <div class="inputs">
      <label for="serving-size">Serving Size:</label>
      <input class="serving-size-cal" id="serving-size" type="text">
      <select class="units-select" name="units" id="units">
        <option value="grams">g</option>
        <option value="ounces">oz</option>
        <option value="cups">cups</option>
        <option value="fluid-oz">fl oz</option>
      </select>
      <label for="calories-per-serving">Calories Per Serving:</label>
      <input class="serving-size-cal" id="calories-per-serving" type="text">
    </div>
    <div class="nutrition-label">
      <div class="nutrition-inputs">
        <input id="fat" type="text" placeholder="Total Fat">
        <input id="carbs" type="text" placeholder="Total Carbohydrates">
        <input id="protein" type="text" placeholder="Protein">
      </div>
      <div class="nutrition-units-select" style="display: flex;
      flex-direction: column;">
        <select id="fat-units" name="fat-units">
          <option value="grams">g</option>
          <option value="milligrams">mg</option>
        </select>
        <select id="carbs-units" name="carbs-units">
          <option value="grams">g</option>
          <option value="milligrams">mg</option>
        </select>
        <select id="protein-units" name="protein-units">
          <option value="grams">g</option>
          <option value="milligrams">mg</option>
        </select>
      </div>
    </div>
    <div class="calculation">
      <div class="actual-amount">
        <div style="margin: 5px; font-family:'Roboto Condensed'; font-size: 14px;">Enter the amount of food that you used</div>
        <!--<label for="actual-amount">Actual Amount:</label>-->
        <input id="actual-amount" type="text" placeholder="Actual Amount">
      </div>
      <div class="calculate-button-display"> 
        <button id="calculate-button" >Calculate</button>
        <input type="text" id="calculated-nutrition" placeholder="Calculated Nutrition">
      </div>
    </div>`
      

  </div>
</div>
